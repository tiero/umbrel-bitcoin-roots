manifestVersion: 1.1
id: bitcoin-roots
implements:
  - bitcoin
storage:
  dataRoot: data
category: bitcoin
name: Bitcoin Roots
version: '1.4.0-roots.1'
tagline: Run your personal Bitcoin Roots node
description: >-
  Validate Bitcoin with Bitcoin Roots, with a browser interface for node settings,
  synchronization, and peer connections. Includes persistent Tor and I2P connectivity;
  onion connection addresses are available in the Connect panel after Tor starts.


  Declares Umbrel Bitcoin node compatibility (implements: bitcoin) so apps such as
  Core Lightning, LND, Electrs, and Bassin can select Bitcoin Roots as their Bitcoin
  node provider. Uses standard Bitcoin ports (P2P 8333, RPC 8332) for full
  DNS-seed clearnet peer discovery with a dedicated Web UI port (2111). Stop
  Bitcoin Core before installing or starting Bitcoin Roots (Bitcoin Knots uses
  9333/9332 and does not collide).
developer: Plan-B Foundation
website: https://plan-b.foundation/bitcoin-roots
dependencies: []
repo: https://github.com/tiero/umbrel-bitcoin-roots
support: https://github.com/tiero/umbrel-bitcoin-roots/issues
port: 2111
gallery: []
path: ''
defaultPassword: ''
releaseNotes: >-
  Adds Umbrel Bitcoin provider compatibility (implements: bitcoin and canonical
  APP_BITCOIN_* exports), keeps standard Bitcoin P2P/RPC ports (8333/8332) with
  dedicated Web UI port 2111, and fixes I2P data permissions.
widgets:
  - id: 'stats'
    type: 'four-stats'
    refresh: '5s'
    endpoint: 'app:3000/api/widget/stats'
    link: ''
    example:
      type: 'four-stats'
      link: ''
      items:
        - title: 'Connections'
          text: '11'
          subtext: 'peers'
        - title: 'Mempool'
          text: '257'
          subtext: 'MB'
        - title: 'Hashrate'
          text: '590'
          subtext: 'EH/s'
        - title: 'Blockchain size'
          text: '600'
          subtext: 'GB'
  - id: 'sync'
    type: 'text-with-progress'
    refresh: '2s'
    endpoint: 'app:3000/api/widget/sync'
    link: ''
    example:
      type: 'text-with-progress'
      link: ''
      title: 'Blockchain sync'
      text: '83%'
      progressLabel: 'In progress'
      progress: 0.83
backupIgnore:
  - data/bitcoin/blocks
  - data/bitcoin/chainstate
  - data/bitcoin/indexes
  - data/bitcoin/testnet3/blocks
  - data/bitcoin/testnet3/chainstate
  - data/bitcoin/testnet3/indexes
  - data/bitcoin/testnet4/blocks
  - data/bitcoin/testnet4/chainstate
  - data/bitcoin/testnet4/indexes
  - data/bitcoin/signet/blocks
  - data/bitcoin/signet/chainstate
  - data/bitcoin/signet/indexes
  - data/bitcoin/regtest/blocks
  - data/bitcoin/regtest/chainstate
  - data/bitcoin/regtest/indexes
